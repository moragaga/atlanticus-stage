[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-json"
version = "0.1.0"
description = "Strict and atomic JSON document primitives for Atlanticus."
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["atlanticus.*"]
namespaces = true

[tool.setuptools.package-data]
"atlanticus.json" = ["py.typed"]
