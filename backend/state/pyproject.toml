[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-state"
version = "0.1.0"
description = "Atomic, compact and extensible state contracts for Atlanticus jobs."
readme = "README.md"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "atlanticus-observability==0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["atlanticus.*"]
namespaces = true

[tool.setuptools.package-data]
"atlanticus.state" = ["py.typed"]
