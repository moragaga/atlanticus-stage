[project]
name = "atlanticus-backend-workspace"
version = "0.1.0"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.uv.sources]
atlanticus-json = { workspace = true }
atlanticus-datasets = { workspace = true }
atlanticus-datasets-parquet = { workspace = true }
atlanticus-datasets-runtime = { workspace = true }
atlanticus-kernel = { workspace = true }
atlanticus-configuration = { workspace = true }
atlanticus-observability = { workspace = true }
atlanticus-observability-azure = { workspace = true }
atlanticus-job-runtime = { workspace = true }
atlanticus-state = { workspace = true }

[tool.uv.workspace]
members = [
    "json",
    "datasets",
    "datasets-parquet",
    "datasets-runtime",
    "kernel",
    "configuration",
    "observability",
    "observability-azure",
    "runtime",
    "state",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "**/commented/**",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = [
    "json/tests",
    "datasets/tests",
    "datasets-parquet/tests",
    "datasets-runtime/tests",
    "kernel/tests",
    "configuration/tests",
    "observability/tests",
    "observability-azure/tests",
    "runtime/tests",
    "state/tests",
]
addopts = "-q"
