[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-job-runtime"
version = "0.4.0"
description = "Ejecución controlada y coordinación de jobs backend Atlanticus."
readme = "README.md"
requires-python = "==3.14.2"
dependencies = [
    "atlanticus-kernel==0.1.0",
    "atlanticus-observability==0.5.0",
    "psutil==7.2.2",
]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.optional-dependencies]
azure = [
    "atlanticus-observability-azure==0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["atlanticus.*"]
namespaces = true

[tool.setuptools.package-data]
"atlanticus.runtime" = ["py.typed"]
