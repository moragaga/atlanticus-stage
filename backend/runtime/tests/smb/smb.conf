[global]
server role = standalone server
security = user
map to guest = Bad User
guest account = nobody
server min protocol = SMB3_00
server max protocol = SMB3_11
smb ports = 445
load printers = no
disable spoolss = yes
printing = bsd
printcap name = /dev/null
log file = /dev/stdout
max log size = 0

[atlanticus]
path = /srv/atlanticus
read only = no
guest ok = yes
guest only = yes
force user = nobody
create mask = 0666
directory mask = 0777
