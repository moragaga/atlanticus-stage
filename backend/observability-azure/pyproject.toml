[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-observability-azure"
version = "0.1.0"
description = "Proyección acotada y exportación Azure Monitor para Atlanticus."
readme = "README.md"
requires-python = "==3.14.2"
dependencies = [
    "atlanticus-observability==0.5.0",
    "azure-monitor-opentelemetry-exporter==1.0.0b55",
    "opentelemetry-sdk==1.43.0",
]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["atlanticus.*"]
namespaces = true

[tool.setuptools.package-data]
"atlanticus.observability_azure" = ["py.typed"]
