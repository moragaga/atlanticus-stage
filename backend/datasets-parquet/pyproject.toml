[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-datasets-parquet"
version = "0.2.0"
description = "Atomic PyArrow and Parquet storage adapter for Atlanticus datasets."
readme = "README.md"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "atlanticus-datasets==0.1.0",
    "pyarrow==25.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["atlanticus.*"]
namespaces = true

[tool.setuptools.package-data]
"atlanticus.datasets.parquet" = ["py.typed"]
