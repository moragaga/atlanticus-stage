[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-data-producers-pi"
version = "0.1.1"
description = "Reusable PI data producer capability for Atlanticus scopes."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "atlanticus-datasets==0.1.0",
    "atlanticus-datasets-parquet==0.2.1",
    "atlanticus-datasets-runtime==0.2.1",
    "atlanticus-job-runtime==0.7.1",
    "atlanticus-observability==0.5.0",
    "atlanticus-pi-contracts==0.1.0",
    "atlanticus-pi-web-api==0.1.0",
    "atlanticus-state==0.2.0",
    "pyarrow==25.0.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.uv.sources]
atlanticus-datasets = { path = "../../../backend/datasets", editable = true }
atlanticus-datasets-parquet = { path = "../../../backend/datasets-parquet", editable = true }
atlanticus-datasets-runtime = { path = "../../../backend/datasets-runtime", editable = true }
atlanticus-job-runtime = { path = "../../../backend/runtime", editable = true }
atlanticus-kernel = { path = "../../../backend/kernel", editable = true }
atlanticus-observability = { path = "../../../backend/observability", editable = true }
atlanticus-pi-contracts = { path = "../../../integrations/pi/contracts", editable = true }
atlanticus-pi-web-api = { path = "../../../integrations/pi/web-api", editable = true }
atlanticus-state = { path = "../../../backend/state", editable = true }
atlanticus-http = { path = "../../../connectivity/http-client", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["atlanticus.data_producers.pi*"]
namespaces = true

[tool.setuptools.package-data]
"atlanticus.data_producers.pi" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["atlanticus"]
combine-as-imports = true
