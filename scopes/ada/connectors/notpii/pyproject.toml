[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-notpii-connector"
version = "0.1.0"
description = "Compatibility facade for the reusable Atlanticus NOT PII data producer."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["atlanticus-data-producers-notpii==0.1.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.uv.sources]
atlanticus-data-producers-notpii = { path = "../../../data-producers/notpii", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.connectors.notpii*"]
namespaces = true

[tool.setuptools.package-data]
"ada.connectors.notpii" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true
