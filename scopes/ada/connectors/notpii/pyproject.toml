[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-notpii-connector"
version = "0.1.0"
description = "NOT PII message and Storage acquisition connector for ADA."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "atlanticus-pi-contracts==0.1.0",
    "atlanticus-service-bus==0.1.0",
    "atlanticus-storage==0.1.0",
    "pandas==3.0.3",
    "pyarrow==25.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.connectors.notpii*"]
namespaces = true

[tool.setuptools.package-data]
"ada.connectors.notpii" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true
