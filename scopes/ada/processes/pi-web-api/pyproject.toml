[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-pi-web-api-process"
version = "0.1.0"
description = "PI Web API materialization process composition for ADA."
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "atlanticus-configuration==0.1.0",
    "atlanticus-http==0.1.0",
    "atlanticus-job-runtime==0.3.0",
    "atlanticus-kernel==0.1.0",
    "atlanticus-key-vault==0.1.0",
    "atlanticus-observability-azure==0.1.0",
    "atlanticus-pi-contracts==0.1.0",
    "atlanticus-pi-web-api==0.1.0",
    "atlanticus-state==0.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[project.scripts]
ada-pi-web-api = "ada.processes.pi_web_api.bootstrap:main"

[tool.atlanticus.container]
command = "ada-pi-web-api"
system-profile = "base"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.processes.pi_web_api*"]
namespaces = true

[tool.setuptools.package-data]
"ada.processes.pi_web_api" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true
