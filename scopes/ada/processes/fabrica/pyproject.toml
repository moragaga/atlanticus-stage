[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-fabrica-process"
version = "0.1.0"
description = "Fabrica plan and KPI materialization process composition for ADA."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "atlanticus-configuration==0.1.0",
    "atlanticus-data-producers-fabrica==0.1.0",
    "atlanticus-job-runtime==0.5.0",
    "atlanticus-kernel==0.1.0",
    "atlanticus-key-vault==0.1.0",
    "atlanticus-observability-azure==0.1.0",
    "atlanticus-storage==0.1.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[project.scripts]
ada-fabrica = "ada.processes.fabrica.bootstrap:main"

[tool.atlanticus.container]
command = "ada-fabrica"
system-profile = "base"

[tool.uv.sources]
atlanticus-data-producers-fabrica = { path = "../../../data-producers/fabrica", editable = true }
atlanticus-configuration = { path = "../../../../backend/configuration", editable = true }
atlanticus-job-runtime = { path = "../../../../backend/runtime", editable = true }
atlanticus-kernel = { path = "../../../../backend/kernel", editable = true }
atlanticus-key-vault = { path = "../../../../connectivity/key-vault", editable = true }
atlanticus-observability = { path = "../../../../backend/observability", editable = true }
atlanticus-observability-azure = { path = "../../../../backend/observability-azure", editable = true }
atlanticus-storage = { path = "../../../../connectivity/storage", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.processes.fabrica*"]
namespaces = true

[tool.setuptools.package-data]
"ada.processes.fabrica" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true
