[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-alarms-runtime-process"
version = "0.5.1"
description = "Alarm Runtime Core-to-Persistence composition for ADA."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-alarms-core==0.6.0",
    "ada-alarms-persistence==0.2.0",
    "ada-operational-data-core==0.1.0",
    "ada-operational-data-planner==0.1.0",
    "ada-operational-data-sources==0.1.0",
    "atlanticus-job-runtime==0.7.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.uv.sources]
ada-alarms-core = { path = "../../alarms/core", editable = true }
ada-alarms-persistence = { path = "../../alarms/persistence", editable = true }
ada-operational-data-core = { path = "../../data/core", editable = true }
ada-operational-data-planner = { path = "../../data/planner", editable = true }
ada-operational-data-sources = { path = "../../data/sources", editable = true }
atlanticus-job-runtime = { path = "../../../../backend/runtime", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.processes.alarms_runtime*"]
namespaces = true

[tool.setuptools.package-data]
"ada.processes.alarms_runtime" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true
