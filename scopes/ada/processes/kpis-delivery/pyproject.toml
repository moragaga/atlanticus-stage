[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-kpis-delivery-process"
version = "0.1.0"
description = "ADA KPI latest delivery process infrastructure boundary."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-kpis-delivery==0.1.0",
    "atlanticus-cosmos==0.1.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.uv.sources]
ada-kpis-delivery = { path = "../../kpis/delivery", editable = true }
atlanticus-cosmos = { path = "../../../../connectivity/cosmos", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.processes.kpis_delivery*"]
namespaces = true

[tool.setuptools.package-data]
"ada.processes.kpis_delivery" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true
