[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-notpii-process"
version = "0.1.0"
description = "NOT PII materialization process composition for ADA."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "atlanticus-configuration==0.1.0",
    "atlanticus-data-producers-notpii==0.1.0",
    "atlanticus-job-runtime==0.7.0",
    "atlanticus-kernel==0.1.0",
    "atlanticus-key-vault==0.1.0",
    "atlanticus-observability-azure==0.1.0",
    "atlanticus-pi-contracts==0.1.0",
    "atlanticus-service-bus==0.1.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[project.scripts]
ada-notpii = "ada.processes.notpii.bootstrap:main"

[tool.atlanticus.container]
command = "ada-notpii"
system-profile = "base"

[tool.uv.sources]
atlanticus-data-producers-notpii = { path = "../../../data-producers/notpii", editable = true }
atlanticus-configuration = { path = "../../../../backend/configuration", editable = true }
atlanticus-job-runtime = { path = "../../../../backend/runtime", editable = true }
atlanticus-kernel = { path = "../../../../backend/kernel", editable = true }
atlanticus-key-vault = { path = "../../../../connectivity/key-vault", editable = true }
atlanticus-observability-azure = { path = "../../../../backend/observability-azure", editable = true }
atlanticus-pi-contracts = { path = "../../../../integrations/pi/contracts", editable = true }
atlanticus-service-bus = { path = "../../../../connectivity/service-bus", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.processes.notpii*"]
namespaces = true

[tool.setuptools.package-data]
"ada.processes.notpii" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true
