[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-notpii-process"
version = "0.1.0"
description = "NOT PII materialization process composition for ADA."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-notpii-connector==0.1.0",
    "atlanticus-configuration==0.1.0",
    "atlanticus-datasets==0.1.0",
    "atlanticus-datasets-parquet==0.2.0",
    "atlanticus-datasets-runtime==0.2.0",
    "atlanticus-job-runtime==0.5.0",
    "atlanticus-kernel==0.1.0",
    "atlanticus-key-vault==0.1.0",
    "atlanticus-observability-azure==0.1.0",
    "atlanticus-pi-contracts==0.1.0",
    "atlanticus-service-bus==0.1.0",
    "atlanticus-state==0.1.0",
    "pandas==3.0.3",
    "pyarrow==25.0.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[project.scripts]
ada-notpii = "ada.processes.notpii.bootstrap:main"

[tool.atlanticus.container]
command = "ada-notpii"
system-profile = "base"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.processes.notpii*"]
namespaces = true

[tool.setuptools.package-data]
"ada.processes.notpii" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true
