[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-kpis-persistence"
version = "0.1.1"
description = "Reusable KPI evaluation persistence capability for ADA."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-kpis-core==0.2.0",
    "atlanticus-json==0.1.0",
    "atlanticus-state==0.2.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.uv.sources]
ada-kpis-core = { path = "../core", editable = true }
atlanticus-json = { path = "../../../../backend/json", editable = true }
atlanticus-state = { path = "../../../../backend/state", editable = true }
atlanticus-observability = { path = "../../../../backend/observability", editable = true }
atlanticus-kernel = { path = "../../../../backend/kernel", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.kpis.persistence*"]
namespaces = true

[tool.setuptools.package-data]
"ada.kpis.persistence" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true
