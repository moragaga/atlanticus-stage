[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-kpis-planner"
version = "0.1.0"
description = "Reusable KPI source requirement planner for ADA."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["ada-kpis-core==0.1.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.uv.sources]
ada-kpis-core = { path = "../core", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.kpis.planner*"]
namespaces = true

[tool.setuptools.package-data]
"ada.kpis.planner" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada"]
combine-as-imports = true
