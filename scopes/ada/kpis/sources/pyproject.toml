[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-kpis-sources"
version = "0.1.0"
description = "Frozen source loading and exact runtime contexts for ADA KPI evaluation."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-kpis-core==0.1.0",
    "ada-kpis-planner==0.1.0",
    "ada-operational-calendar==0.2.0",
    "atlanticus-datasets==0.1.0",
    "atlanticus-datasets-runtime==0.2.0",
    "pandas==3.0.3",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.uv.sources]
ada-kpis-core = { path = "../core", editable = true }
ada-kpis-planner = { path = "../planner", editable = true }
ada-operational-calendar = { path = "../../operational-calendar", editable = true }
atlanticus-datasets = { path = "../../../../backend/datasets", editable = true }
atlanticus-datasets-parquet = { path = "../../../../backend/datasets-parquet", editable = true }
atlanticus-datasets-runtime = { path = "../../../../backend/datasets-runtime", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.kpis.sources*"]
namespaces = true

[tool.setuptools.package-data]
"ada.kpis.sources" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true
