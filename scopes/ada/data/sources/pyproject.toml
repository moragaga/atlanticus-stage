[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-operational-data-sources"
version = "0.1.0"
description = "Shared operational data source bindings and loading for ADA domains."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-operational-calendar==0.2.0",
    "ada-operational-data-core==0.1.0",
    "ada-operational-data-planner==0.1.0",
    "atlanticus-datasets==0.1.0",
    "pandas==3.0.3",
    "pyarrow==25.0.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.uv.sources]
ada-operational-calendar = { path = "../../operational-calendar", editable = true }
ada-operational-data-core = { path = "../core", editable = true }
ada-operational-data-planner = { path = "../planner", editable = true }
atlanticus-datasets = { path = "../../../../backend/datasets", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.data.sources*"]
namespaces = true

[tool.setuptools.package-data]
"ada.data.sources" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true
