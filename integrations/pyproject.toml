[tool.uv.sources]
atlanticus-http = { path = "../connectivity/http-client", editable = true }
atlanticus-observability = { path = "../backend/observability", editable = true }
atlanticus-kernel = { path = "../backend/kernel", editable = true }

[tool.uv.workspace]
members = ["pi/contracts", "pi/web-api"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["*/commented/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
