[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-pi-contracts"
version = "0.1.0"
description = "Generic PI domain contracts for Atlanticus integrations."
readme = "README.md"
requires-python = "==3.14.2"
license = "LicenseRef-Proprietary"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["atlanticus.integrations.pi.contracts*"]
namespaces = true

[tool.setuptools.package-data]
"atlanticus.integrations.pi.contracts" = ["py.typed"]
