[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-blockgrade-process"
version = "0.1.0"
description = "Blockgrade materialization process composition for ADA."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-operational-calendar==0.2.0",
    "atlanticus-configuration==0.1.0",
    "atlanticus-data-producers-core==0.1.0",
    "atlanticus-data-producers-sql==0.1.0",
    "atlanticus-job-runtime==0.5.0",
    "atlanticus-kernel==0.1.0",
    "atlanticus-key-vault==0.1.0",
    "atlanticus-observability-azure==0.1.0",
    "atlanticus-sql==0.1.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]
bundle-internal = [
    "ada-operational-calendar==0.2.0",
    "atlanticus-kernel==0.1.0",
    "atlanticus-configuration==0.1.0",
    "atlanticus-data-producers-core==0.1.0",
    "atlanticus-datasets==0.1.0",
    "atlanticus-datasets-parquet==0.2.0",
    "atlanticus-datasets-runtime==0.2.0",
    "atlanticus-observability==0.5.0",
    "atlanticus-job-runtime==0.5.0",
    "atlanticus-sql==0.1.0",
    "atlanticus-state==0.1.0",
    "atlanticus-data-producers-sql==0.1.0",
    "atlanticus-key-vault==0.1.0",
    "atlanticus-observability-azure==0.1.0",
]

[project.scripts]
ada-blockgrade = "ada.processes.blockgrade.bootstrap:main"

[tool.atlanticus.container]
command = "ada-blockgrade"
system-profile = "sqlserver"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.processes.blockgrade*"]
namespaces = true

[tool.setuptools.package-data]
"ada.processes.blockgrade" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.uv]
default-groups = []

[tool.uv.sources]
ada-operational-calendar = { path = "wheels/ada_operational_calendar-0.2.0-py3-none-any.whl" }
atlanticus-configuration = { path = "wheels/atlanticus_configuration-0.1.0-py3-none-any.whl" }
atlanticus-data-producers-core = { path = "wheels/atlanticus_data_producers_core-0.1.0-py3-none-any.whl" }
atlanticus-data-producers-sql = { path = "wheels/atlanticus_data_producers_sql-0.1.0-py3-none-any.whl" }
atlanticus-datasets = { path = "wheels/atlanticus_datasets-0.1.0-py3-none-any.whl" }
atlanticus-datasets-parquet = { path = "wheels/atlanticus_datasets_parquet-0.2.0-py3-none-any.whl" }
atlanticus-datasets-runtime = { path = "wheels/atlanticus_datasets_runtime-0.2.0-py3-none-any.whl" }
atlanticus-job-runtime = { path = "wheels/atlanticus_job_runtime-0.5.0-py3-none-any.whl" }
atlanticus-kernel = { path = "wheels/atlanticus_kernel-0.1.0-py3-none-any.whl" }
atlanticus-key-vault = { path = "wheels/atlanticus_key_vault-0.1.0-py3-none-any.whl" }
atlanticus-observability = { path = "wheels/atlanticus_observability-0.5.0-py3-none-any.whl" }
atlanticus-observability-azure = { path = "wheels/atlanticus_observability_azure-0.1.0-py3-none-any.whl" }
atlanticus-sql = { path = "wheels/atlanticus_sql-0.1.0-py3-none-any.whl" }
atlanticus-state = { path = "wheels/atlanticus_state-0.1.0-py3-none-any.whl" }
