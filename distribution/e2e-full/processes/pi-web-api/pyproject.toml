[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-pi-web-api-process"
version = "0.1.0"
description = "PI Web API materialization process composition for ADA."
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "atlanticus-configuration==0.1.0",
    "atlanticus-data-producers-pi==0.1.0",
    "atlanticus-http==0.1.0",
    "atlanticus-job-runtime==0.5.0",
    "atlanticus-kernel==0.1.0",
    "atlanticus-key-vault==0.1.0",
    "atlanticus-observability-azure==0.1.0",
    "atlanticus-pi-contracts==0.1.0",
    "atlanticus-pi-web-api==0.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]
bundle-internal = [
    "atlanticus-kernel==0.1.0",
    "atlanticus-configuration==0.1.0",
    "atlanticus-datasets==0.1.0",
    "atlanticus-datasets-parquet==0.2.0",
    "atlanticus-datasets-runtime==0.2.0",
    "atlanticus-observability==0.5.0",
    "atlanticus-job-runtime==0.5.0",
    "atlanticus-pi-contracts==0.1.0",
    "atlanticus-http==0.1.0",
    "atlanticus-pi-web-api==0.1.0",
    "atlanticus-state==0.1.0",
    "atlanticus-data-producers-pi==0.1.0",
    "atlanticus-key-vault==0.1.0",
    "atlanticus-observability-azure==0.1.0",
]

[project.scripts]
ada-pi-web-api = "ada.processes.pi_web_api.bootstrap:main"

[tool.atlanticus.container]
command = "ada-pi-web-api"
system-profile = "base"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.processes.pi_web_api*"]
namespaces = true

[tool.setuptools.package-data]
"ada.processes.pi_web_api" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.uv]
default-groups = []

[tool.uv.sources]
atlanticus-configuration = { path = "wheels/atlanticus_configuration-0.1.0-py3-none-any.whl" }
atlanticus-data-producers-pi = { path = "wheels/atlanticus_data_producers_pi-0.1.0-py3-none-any.whl" }
atlanticus-datasets = { path = "wheels/atlanticus_datasets-0.1.0-py3-none-any.whl" }
atlanticus-datasets-parquet = { path = "wheels/atlanticus_datasets_parquet-0.2.0-py3-none-any.whl" }
atlanticus-datasets-runtime = { path = "wheels/atlanticus_datasets_runtime-0.2.0-py3-none-any.whl" }
atlanticus-http = { path = "wheels/atlanticus_http-0.1.0-py3-none-any.whl" }
atlanticus-job-runtime = { path = "wheels/atlanticus_job_runtime-0.5.0-py3-none-any.whl" }
atlanticus-kernel = { path = "wheels/atlanticus_kernel-0.1.0-py3-none-any.whl" }
atlanticus-key-vault = { path = "wheels/atlanticus_key_vault-0.1.0-py3-none-any.whl" }
atlanticus-observability = { path = "wheels/atlanticus_observability-0.5.0-py3-none-any.whl" }
atlanticus-observability-azure = { path = "wheels/atlanticus_observability_azure-0.1.0-py3-none-any.whl" }
atlanticus-pi-contracts = { path = "wheels/atlanticus_pi_contracts-0.1.0-py3-none-any.whl" }
atlanticus-pi-web-api = { path = "wheels/atlanticus_pi_web_api-0.1.0-py3-none-any.whl" }
atlanticus-state = { path = "wheels/atlanticus_state-0.1.0-py3-none-any.whl" }
