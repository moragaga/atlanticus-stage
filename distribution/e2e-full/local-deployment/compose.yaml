name: atlanticus-e2e-full-local
services:
  pi-web-api:
    image: atlanticus-e2e-full-pi-web-api:local
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        FILENAME: pi-web-api
    command: ["--run-once"]
    env_file:
      - ../processes/pi-web-api/.env
    environment:
      VOLUMEN_PATH: /app/volume
    volumes:
      - runtime:/app/volume
    cpus: 0.5
    mem_limit: 1g
  notpii:
    image: atlanticus-e2e-full-notpii:local
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        FILENAME: notpii
    command: ["--run-once"]
