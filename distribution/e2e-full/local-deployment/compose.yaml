      VOLUMEN_PATH: /app/volume
    volumes:
      - runtime:/app/volume
    cpus: 0.5
    mem_limit: 1g
  remanentes:
    image: atlanticus-e2e-full-remanentes:local
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        FILENAME: remanentes
    command: ["--run-once"]
    env_file:
      - ../processes/remanentes/.env
    environment:
      VOLUMEN_PATH: /app/volume
    volumes:
