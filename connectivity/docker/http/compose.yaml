name: atlanticus-http-integration

services:
  http-fake-api:
    image: python:3.14.2-slim-bookworm
    hostname: http-fake-api
    init: true
    environment:
      ATLANTICUS_FAKE_HTTP_BEARER_TOKEN: "${ATLANTICUS_FAKE_HTTP_BEARER_TOKEN:-atlanticus-bearer-token}"
      ATLANTICUS_FAKE_HTTP_BASIC_USERNAME: "${ATLANTICUS_FAKE_HTTP_BASIC_USERNAME:-atlanticus-user}"
      ATLANTICUS_FAKE_HTTP_BASIC_PASSWORD: "${ATLANTICUS_FAKE_HTTP_BASIC_PASSWORD:-atlanticus-password}"
    command: ["python", "/app/fake_api.py"]
    volumes:
      - ./fake_api.py:/app/fake_api.py:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1).read()",
        ]
      interval: 1s
      timeout: 2s
      retries: 30
    restart: "no"
    mem_limit: 256m
    cpus: 0.50

  http-integration:
    image: atlanticus-http-integration:local
    build:
      context: ../../..
      dockerfile: connectivity/docker/http/Dockerfile
    init: true
    depends_on:
      http-fake-api:
        condition: service_healthy
    environment:
      ATLANTICUS_RUN_HTTP_INTEGRATION: "1"
      ATLANTICUS_FAKE_HTTP_BASE_URL: "http://http-fake-api:8080"
      ATLANTICUS_FAKE_HTTP_BEARER_TOKEN: "${ATLANTICUS_FAKE_HTTP_BEARER_TOKEN:-atlanticus-bearer-token}"
      ATLANTICUS_FAKE_HTTP_BASIC_USERNAME: "${ATLANTICUS_FAKE_HTTP_BASIC_USERNAME:-atlanticus-user}"
      ATLANTICUS_FAKE_HTTP_BASIC_PASSWORD: "${ATLANTICUS_FAKE_HTTP_BASIC_PASSWORD:-atlanticus-password}"
    restart: "no"
    mem_limit: 512m
    cpus: 0.50
