[project]
name = "atlanticus-connectivity-workspace"
version = "0.1.0"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.uv.sources]
atlanticus-kernel = { path = "../backend/kernel", editable = true }
atlanticus-observability = { path = "../backend/observability", editable = true }
atlanticus-blob = { workspace = true }
atlanticus-service-bus = { workspace = true }
atlanticus-http = { workspace = true }
atlanticus-sql = { workspace = true }
atlanticus-cosmos = { workspace = true }
atlanticus-redis = { workspace = true }
atlanticus-key-vault = { workspace = true }

[tool.uv.workspace]
members = [
    "blob",
    "service-bus",
    "http-client",
    "sql",
    "cosmos",
    "redis-store",
    "key-vault",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "**/commented/**",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = [
    "blob/tests",
    "service-bus/tests",
    "http-client/tests",
    "sql/tests",
    "cosmos/tests",
    "redis-store/tests",
    "key-vault/tests",
]
addopts = "-q --import-mode=importlib"
markers = [
    "integration: pruebas que requieren servicios externos dentro de Docker",
]
