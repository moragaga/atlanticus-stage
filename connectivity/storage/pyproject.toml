[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-storage"
version = "0.1.0"
description = "Generic synchronous Azure Blob Storage connectivity for Atlanticus."
requires-python = "==3.14.2"
dependencies = [
    "atlanticus-observability==0.5.0",
    "azure-storage-blob==12.30.0",
]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["atlanticus.*"]
namespaces = true

[tool.setuptools.package-data]
"atlanticus.connectivity.storage" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
markers = [
    "integration: pruebas que requieren servicios externos dentro de Docker",
]
