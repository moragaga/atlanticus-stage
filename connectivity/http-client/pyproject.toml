[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-http"
version = "0.1.0"
description = "Generic synchronous HTTP connectivity for Atlanticus."
readme = "README.md"
requires-python = "==3.14.2"
dependencies = [
    "atlanticus-observability==0.5.0",
    "httpx==0.28.1",
]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["atlanticus.*"]
namespaces = true

[tool.setuptools.package-data]
"atlanticus.connectivity.http" = ["py.typed"]
